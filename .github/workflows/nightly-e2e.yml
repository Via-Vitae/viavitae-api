name: Nightly E2E — viavitae-api

# Boots the compose stack and runs the repo-local k6 smoke test.
#
# The shared Playwright suite from viavitae-qa is NOT run here because it
# requires the full pnpm workspace (workspace:* dependencies) and the web
# (port 3000) and demo (port 3001) services, which are not part of the API
# compose stack. Playwright E2E is covered by viavitae-qa's own nightly
# workflow which boots the full stack.

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  e2e:
    name: k6 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Boot the stack
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose up -d --wait postgres redis api

      - name: k6 smoke (repo-local script)
        run: >-
          docker run --rm --network host -v "$PWD":/k6
          grafana/k6 run /k6/deployments/k6/smoke.js

      - name: Tear down
        if: always()
        run: docker compose down -v

# ExternalSecret — materialises viavitae-api-secrets from SOPS/age-encrypted
# values held outside the cluster. Zero secret material lives in git: this file
# only names keys and points at the store. The ClusterSecretStore (`sops-age`)
# and the encrypted source document are owned by viavitae-infra; adjust the
# store name and remote key to match that layout.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: viavitae-api-secrets
  namespace: viavitae
  labels:
    app.kubernetes.io/name: viavitae-api
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: viavitae
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sops-age
  target:
    name: viavitae-api-secrets
    creationPolicy: Owner
  data:
    # One property per runtime secret; names match app/core/config.py fields.
    - secretKey: DATABASE_URL
      remoteRef: { key: viavitae-api, property: DATABASE_URL }
    - secretKey: REDIS_URL
      remoteRef: { key: viavitae-api, property: REDIS_URL }
    - secretKey: BITRIX24_WEBHOOK_URL
      remoteRef: { key: viavitae-api, property: BITRIX24_WEBHOOK_URL }
    - secretKey: STRIPE_SECRET_KEY
      remoteRef: { key: viavitae-api, property: STRIPE_SECRET_KEY }
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef: { key: viavitae-api, property: STRIPE_WEBHOOK_SECRET }
    - secretKey: PAYSERA_PROJECT_ID
      remoteRef: { key: viavitae-api, property: PAYSERA_PROJECT_ID }
    - secretKey: PAYSERA_SIGN_PASSWORD
      remoteRef: { key: viavitae-api, property: PAYSERA_SIGN_PASSWORD }
    - secretKey: LLM_API_KEY
      remoteRef: { key: viavitae-api, property: LLM_API_KEY }
    - secretKey: SMTP_URL
      remoteRef: { key: viavitae-api, property: SMTP_URL }
    - secretKey: SMS_PROVIDER_URL
      remoteRef: { key: viavitae-api, property: SMS_PROVIDER_URL }

[project]
name = "viavitae-api"
version = "0.1.0"
description = "ViaVitae backend services — assessment, quotes, donations, AI pastoral assistant, cemetery GIS, notifications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "ViaVitae architects" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.14",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "structlog>=24.4",
  "redis>=5.2",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-redis",
  "bandit[toml]>=1.7",
  "import-linter>=2.0",
  "respx>=0.21",
]
pdf = ["weasyprint>=62"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations"]

[[tool.mypy.overrides]]
module = ["weasyprint.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "anyio: async tests",
  "contract: provider contract tests (no network)",
  "isolation: cross-tenant isolation/RLS tests requiring a provisioned database",
  "e2e: end-to-end tests requiring docker-compose services",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Ratchet: the floor only moves up. Measured on the offline suite (`-m "not
# isolation"`) it is currently ~85.7%; 85 matches the CI gate in the spec and
# leaves a small buffer. Raise it as real endpoint coverage lands, never lower it.
fail_under = 85
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "app/db/migrations"]
skips = ["B101"]

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Routers must not import models directly"
type = "forbidden"
source_modules = ["app.api.v1"]
forbidden_modules = ["app.models", "app.db"]
# Routers reach persistence only through the app.api.deps seam, so an indirect
# chain (router -> deps -> db) is allowed; a direct model/db import is not.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Services must not import the HTTP layer"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.api"]
